[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "basaltic-sdk-python"
version = "0.1.1"
description = "Official typed synchronous and asynchronous Python SDK for Basaltic"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28.1,<1"]
keywords = ["basaltic", "cloud", "sdk", "asyncio"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Typing :: Typed"]

[project.urls]
Homepage = "https://basaltic.sh"
Documentation = "https://docs.basaltic.sh"
Repository = "https://github.com/basaltic-sh/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/basaltic"]

[tool.hatch.build.targets.sdist]
include = ["/src/basaltic", "/README.md", "/SECURITY.md", "/LICENSE", "/pyproject.toml"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests/typing_check.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
