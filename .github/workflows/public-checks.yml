# Generated by the public release publisher. Source snapshots originate in GitLab.
name: Public source checks and PyPI release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python scripts/check.py
      - run: python scripts/check_package.py
  publish:
    name: Publish PyPI distributions
    if: vars.PYPI_RELEASE_ENABLED == 'true' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/basaltic-sh-sdk-python/
    concurrency:
      group: pypi-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify tag and distributable source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_package.py
      - name: Build distributions from the release tag
        env:
          SOURCE_DATE_EPOCH: '1700000000'
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          git diff --exit-code
      - name: Publish with OIDC and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true
